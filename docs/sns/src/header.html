<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{width:1500px;height:500px;position:relative;
 background:radial-gradient(circle at 80% 30%,var(--bg2),var(--bg) 60%)}
.copy{position:absolute;left:150px;top:120px;color:#fff}
.copy h1{font-size:92px;font-weight:800;letter-spacing:.04em;line-height:1}
.copy p{margin-top:26px;font-size:34px;font-weight:700;color:#dfe3ff}
.copy .tag{display:inline-block;margin-top:24px;font-size:22px;font-weight:700;color:var(--ink);background:var(--b);padding:6px 16px;border-radius:999px}
.list{position:absolute;right:120px;top:70px;width:560px;display:flex;flex-direction:column;gap:12px;
 background:rgba(255,255,255,.04);padding:20px;border-radius:20px}
.row{height:76px}.lbl{width:76px;font-size:40px}
.chip{font-size:22px;padding:10px 14px}
</style></head><body>
<div class="copy">
 <h1>タスクランク</h1>
 <p>勉強のやることを、S / A / B / C で並べる。</p>
 <span class="tag">開発中 ── 作る過程を記録しています</span>
</div>
<div class="list">
 <div class="row"><div class="lbl s">S</div><div class="trk"><span class="chip">過去問 第3回</span><span class="chip">英単語100個</span></div></div>
 <div class="row"><div class="lbl a">A</div><div class="trk"><span class="chip">数学の復習</span><span class="chip">レポート構成</span></div></div>
 <div class="row"><div class="lbl b">B</div><div class="trk"><span class="chip">ノート整理</span></div></div>
 <div class="row"><div class="lbl c">C</div><div class="trk"><span class="chip">参考書を選ぶ</span></div></div>
</div></body></html>
